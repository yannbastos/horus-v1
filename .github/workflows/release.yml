name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Canais independentes; uma publicação por canal, sem cancelar publicação em curso.
concurrency:
  group: release-${{ contains(github.ref_name, '-test.') && 'test' || 'production' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  HORUS_RELEASE_DIR: ${{ github.workspace }}/.release-candidate
  AWS_PAGER: ''

jobs:
  verify-version:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    env:
      HORUS_UPDATE_CHANNEL: ${{ contains(github.ref_name, '-test.') && 'test' || 'production' }}
      HORUS_UPDATE_BASE_URL: ${{ vars[format('UPDATE_{0}_BASE_URL', contains(github.ref_name, '-test.') && 'TEST' || 'PRODUCTION')] }}
      HORUS_CI_READ_TOKEN: ${{ secrets[format('UPDATE_{0}_CI_TOKEN', contains(github.ref_name, '-test.') && 'TEST' || 'PRODUCTION')] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - id: version
        run: node scripts/release/cli.mjs verify-version

  test:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências de teste com lockfiles
        run: |
          python -m pip install uv==0.9.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv sync --project backend --frozen --extra test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Guardas, contratos e ensaio local assinado
        run: |
          node --test scripts/product-version.test.mjs scripts/release/*.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/dry-run.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Backend completo e transversais em processos separados
        run: ./scripts/release/test-backend.ps1
      - name: Frontend build e Playwright (Edge do runner)
        run: |
          npm --prefix frontend run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Rust
        run: |
          # generate_context exige a pasta resources; fixture de compilação, nunca produto.
          New-Item -ItemType Directory -Force backend/dist/horus-backend | Out-Null
          Set-Content backend/dist/horus-backend/test-placeholder.txt 'CI cargo-test fixture; not a backend executable.'
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build:
    needs: [verify-version, test]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      HORUS_UPDATE_CHANNEL: ${{ needs.verify-version.outputs.channel }}
      # Sem Environment nem secrets: somente configuração pública do repositório.
      HORUS_UPDATE_BASE_URL: ${{ vars[format('UPDATE_{0}_BASE_URL', needs.verify-version.outputs.channel == 'test' && 'TEST' || 'PRODUCTION')] }}
      HORUS_UPDATER_PUBKEY: ${{ vars[format('UPDATE_{0}_UPDATER_PUBKEY', needs.verify-version.outputs.channel == 'test' && 'TEST' || 'PRODUCTION')] }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências e overlay HTTPS
        run: |
          python -m pip install uv==0.9.5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/cli.mjs overlay
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: NSIS sem assinatura e sem segredos (sem executar instalador)
        run: |
          npm --prefix frontend run tauri build -- --no-sign --config "$env:HORUS_RELEASE_DIR/tauri.generated.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/cli.mjs collect
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: |
            ${{ env.HORUS_RELEASE_DIR }}/*.exe
            ${{ env.HORUS_RELEASE_DIR }}/tauri.generated.json
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: [verify-version, test, build]
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ${{ needs.verify-version.outputs.channel }}
    env:
      HORUS_UPDATE_CHANNEL: ${{ needs.verify-version.outputs.channel }}
      HORUS_UPDATE_BASE_URL: ${{ vars.HORUS_UPDATE_BASE_URL }}
      HORUS_UPDATER_PUBKEY: ${{ vars.HORUS_UPDATER_PUBKEY }}
      HORUS_CI_READ_TOKEN: ${{ secrets.HORUS_CI_READ_TOKEN }}
      HORUS_RELEASE_NOTES: ${{ vars.HORUS_RELEASE_NOTES }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: ${{ env.HORUS_RELEASE_DIR }}
      - name: Assinar, verificar minisign e vincular versão
        run: |
          npm ci --prefix frontend --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/cli.mjs sign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/cli.mjs candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-signed
          path: ${{ env.HORUS_RELEASE_DIR }}/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [verify-version, sign]
    runs-on: windows-latest
    timeout-minutes: 20
    # Configurar production com required reviewers; CLI também recusa ausência dessa proteção.
    environment: ${{ needs.verify-version.outputs.channel }}
    env:
      GH_TOKEN: ${{ github.token }}
      HORUS_UPDATE_CHANNEL: ${{ needs.verify-version.outputs.channel }}
      HORUS_UPDATE_BASE_URL: ${{ vars.HORUS_UPDATE_BASE_URL }}
      HORUS_UPDATER_PUBKEY: ${{ vars.HORUS_UPDATER_PUBKEY }}
      HORUS_CI_READ_TOKEN: ${{ secrets.HORUS_CI_READ_TOKEN }}
      HORUS_R2_BUCKET: ${{ vars.HORUS_R2_BUCKET }}
      HORUS_R2_ENDPOINT: ${{ vars.HORUS_R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-signed
          path: ${{ env.HORUS_RELEASE_DIR }}
      - name: Validar e enviar artefatos; latest por último
        run: |
          npm ci --prefix infra/cloudflare --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/release/cli.mjs publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Pós-publicação via Worker autenticado
        run: node scripts/release/cli.mjs post-verify
