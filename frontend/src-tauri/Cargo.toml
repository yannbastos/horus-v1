[package]
name = "horus-desktop"
version = "0.1.0"
description = "Hórus — plataforma de inteligência audiovisual"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "=2.14.1"
semver = "=1.0.28"
reqwest = { version = "=0.13.5", features = ["json"] }
time = { version = "=0.3.55", features = ["formatting"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }
